<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Dash Easy</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111827;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:40px;
    font-weight:bold;
}

#best{
    position:absolute;
    top:70px;
    left:20px;
    color:#00ffff;
    font-size:20px;
}

#gameover{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

button{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="score">0</div>
<div id="best"></div>

<div id="gameover">
    <h1>Game Over</h1>
    <button onclick="restart()">Rejouer</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize)
