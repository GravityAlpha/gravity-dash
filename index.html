<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Dash Easy</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111827;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:40px;
    font-weight:bold;
}

#best{
    position:absolute;
    top:70px;
    left:20px;
    color:#00ffff;
    font-size:20px;
}

#gameover{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="score">0</div>
<div id="best"></div>

<div id="gameover">
    <h1>Game Over</h1>
    <button onclick="restart()">Rejouer</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let score = 0;
let best = Number(localStorage.getItem("bestScore")) || 0;

document.getElementById("best").textContent =
"Record : " + best;

const player = {
    x:150,
    y:canvas.height/2,
    size:30,
    vy:0
};

let gravity = 0.15;
const speed = 2;

const obstacles = [];

function createObstacle(){

    const gap = 280;

    const topHeight =
        Math.random() *
        (canvas.height-gap-200)
        +100;

    obstacles.push({
        x:canvas.width,
        width:60,
        top:topHeight,
        bottom:topHeight+gap,
        passed:false
    });
}

setInterval(()=>{
    createObstacle();
},3000);

function update(){

    player.vy += gravity;
    player.y += player.vy;

    if(
        player.y < 0 ||
        player.y > canvas.height
    ){
        gameOver();
    }

    obstacles.forEach((obs,index)=>{

        obs.x -= speed;

        if(
            player.x + player.size/2 > obs.x &&
            player.x - player.size/2 < obs.x + obs.width
        ){
            if(
                player.y - player.size/2 < obs.top ||
                player.y + player.size/2 > obs.bottom
            ){
                gameOver();
            }
        }

        if(
            !obs.passed &&
            obs.x + obs.width < player.x
        ){
            obs.passed = true;
            score++;

            document.getElementById("score").textContent =
            score;

            if(score > best){
                best = score;

                localStorage.setItem(
                    "bestScore",
                    best
                );

                document.getElementById("best").textContent =
                "Record : " + best;
            }
        }

        if(obs.x < -100){
            obstacles.splice(index,1);
        }

    });

}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    obstacles.forEach(obs=>{

        ctx.fillStyle="#ff00ff";

        ctx.fillRect(
            obs.x,
            0,
            obs.width,
            obs.top
        );

        ctx.fillRect(
            obs.x,
            obs.bottom,
            obs.width,
            canvas.height
        );

    });

    const hue = (score*15)%360;

    ctx.fillStyle =
    `hsl(${hue},100%,50%)`;

    ctx.fillRect(
        player.x-player.size/2,
        player.y-player.size/2,
        player.size,
        player.size
    );

}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

function restart(){

    score = 0;

    document.getElementById("score").textContent = 0;

    player
