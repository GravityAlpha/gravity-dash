<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Dash</title>

<style>
body{
margin:0;
overflow:hidden;
background:#0f172a;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:20px;
left:20px;
color:white;
z-index:10;
}

#score{
font-size:48px;
font-weight:bold;
}

#best{
font-size:20px;
color:#00ffff;
}

#difficulty{
font-size:16px;
margin-top:5px;
}

.overlay{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.5);
color:white;
z-index:20;
}

button{
margin:10px;
padding:12px 25px;
font-size:18px;
font-weight:bold;
cursor:pointer;
border:none;
border-radius:8px;
background:#00ffff;
}
</style>
</head>
<body>

<div id="ui">
<div id="score">0</div>
<div id="best">Best : 0</div>
<div id="difficulty"></div>
</div>

<div id="startScreen" class="overlay">

<h1>GRAVITY DASH</h1>

<button onclick="startGame('easy')">
EASY
</button>

<button onclick="startGame('medium')">
MEDIUM
</button>

<button onclick="startGame('hard')">
HARD
</button>

</div>

<div id="gameOver" class="overlay" style="display:none;">
<h1>GAME OVER</h1>
<button onclick="restart()">REJOUER</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

let running=false;
let difficulty="easy";

let gravity=0.04;
let speed=0.35;
let jumpForce=1;

let score=0;
let bestScore=
Number(localStorage.getItem("bestScore"))||0;

document.getElementById("best").textContent=
"Best : "+bestScore;

const player={
x:180,
y:300,
size:30,
vy:0,
rot:0
};

const obstacles=[];
const particles=[];

const audioCtx=
new (window.AudioContext||
window.webkitAudioContext)();

function beep(f,t){

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.frequency.value=f;

osc.connect(gain);
gain.connect(audioCtx.destination);

gain.gain.value=0.03;

osc.start();

setTimeout(()=>{
osc.stop();
},t);

}

function getColor(){

return `hsl(${score*20},100%,50%)`;

}

function startGame(level){

difficulty=level;

if(level==="easy"){

gravity=0.04;
speed=0.35;
jumpForce=1;

}

if(level==="medium"){

gravity=0.05;
speed=0.8;
jumpForce=1.5;

}

if(level==="hard"){

gravity=0.07;
speed=1.5;
jumpForce=2.5;

}

document.getElementById(
"difficulty"
).textContent=
level.toUpperCase();

player.y=canvas.height/2;

running=true;

document.getElementById(
"startScreen"
).style.display="none";

}

function createObstacle(){

const gap=
Math.max(
180,
260-score
);

const top=
Math.random()*
(canvas.height-gap-200)
+100;

obstacles.push({

x:canvas.width,

width:50,

top:top,

bottom:top+gap,

passed:false

});

}

setInterval(()=>{

if(running){

createObstacle();

}

},2500);

function flipGravity(){

gravity*=-1;

if(gravity>0){
player.vy=jumpForce;
}else{
player.vy=-jumpForce;
}

beep(500,40);

}

function crash(){

running=false;

beep(120,400);

document.getElementById(
"gameOver"
).style.display="flex";

}

function update(){

if(!running)return;

speed+=0.000003;

player.vy+=gravity;
player.y+=player.vy;
player.rot+=0.05;

for(let i=0;i<2;i++){

particles.push({

x:player.x,
y:player.y,

vx:Math.random()*2-1,
vy:Math.random()*2-1,

life:25

});

}

particles.forEach((p,i)=>{

p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0){

particles.splice(i,1);

}

});

if(
player.y<15||
player.y>canvas.height-15
){
crash();
}

obstacles.forEach((o,i)=>{

o.x-=speed;

if(

player.x+15>o.x &&
player.x-15<o.x+o.width

){

if(

player.y-15<o.top ||
player.y+15>o.bottom

){

crash();

}

}

if(
!o.passed &&
o.x+o.width<player.x
){

o.passed=true;

score++;

document.getElementById(
"score"
).textContent=score;

beep(900,30);

if(score>bestScore){

bestScore=score;

localStorage.setItem(
"bestScore",
bestScore
);

document.getElementById(
"best"
).textContent=
"Best : "+bestScore;

}

}

if(o.x<-100){

obstacles.splice(i,1);

}

});

}

function draw(){

ctx.fillStyle="#0f172a";
ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

particles.forEach(p=>{

ctx.globalAlpha=
p.life/25;

ctx.fillStyle=
getColor();

ctx.beginPath();

ctx.arc(
p.x,
p.y,
3,
0,
Math.PI*2
);

ctx.fill();

});

ctx.globalAlpha=1;

ctx.fillStyle="#ff00ff";

obstacles.forEach(o=>{

ctx.fillRect(
o.x,
0,
o.width,
o.top
);

ctx.fillRect(
o.x,
o.bottom,
o.width,
canvas.height
);

});

ctx.save();

ctx.translate(
player.x,
player.y
);

ctx.rotate(
player.rot
);

ctx.shadowBlur=20;

ctx.shadowColor=
getColor();

ctx.fillStyle=
getColor();

ctx.fillRect(
-15,
-15,
30,
30
);

ctx.restore();

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}

function restart(){

score=0;

document.getElementById(
"score"
).textContent=0;

obstacles.length=0;
particles.length=0;

player.y=
canvas.height/2;

player.vy=0;

document.getElementById(
"gameOver"
