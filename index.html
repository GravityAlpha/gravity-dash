<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Dash</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#0f172a;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    z-index:10;
}

#score{
    font-size:42px;
    font-weight:bold;
}

#best{
    font-size:18px;
    color:#00ffff;
}

#startScreen,
#gameOver{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    color:white;
    z-index:20;
}

#gameOver{
    display:none;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    background:#00ffff;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
    <div id="score">0</div>
    <div id="best">Best : 0</div>
</div>

<div id="startScreen">
    <h1>GRAVITY DASH</h1>
    <p>Clique pour commencer</p>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="restart()">Rejouer</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let started = false;
let running = false;

let gravity = 0.55;
let speed = 7;

let score = 0;
let bestScore =
Number(localStorage.getItem("bestScore")) || 0;

document.getElementById("best").textContent =
"Best : " + bestScore;

const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;

const audioCtx = new AudioContextClass();

function beep(freq,duration){

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.value = 0.05;

    osc.start();

    setTimeout(()=>{
        osc.stop();
    },duration);
}

const ball = {
    x:180,
    y:canvas.height/2,
    size:30,
    vy:0,
    rotation:0
};

const particles = [];
const obstacles = [];

function createObstacle(){

    const gap = Math.max(120,180-score*2);

    const topHeight =
        Math.random() *
        (canvas.height-gap-100) + 50;

    obstacles.push({
        x:canvas.width,
        width:60,
        topHeight:topHeight,
        bottomY:topHeight+gap,
        passed:false
    });
}

setInterval(()=>{

    if(running){
        createObstacle();
    }

},1400);

function spawnParticles(){

    for(let i=0;i<3;i++){

        particles.push({
            x:ball.x,
            y:ball.y,
            vx:Math.random()*4-2,
            vy:Math.random()*4-2,
            life:25
        });
    }
}

function lose(){

    if(!running) return;

    beep(160,300);

    running = false;

    shake();

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}

function shake(){

    canvas.style.transform =
        `translate(${Math.random()*10-5}px,${Math.random()*10-5}px)`;

    setTimeout(()=>{
        canvas.style.transform="translate(0,0)";
    },150);
}

function update(){

    if(!running) return;

    speed += 0.001;

    ball.vy += gravity;
    ball.y += ball.vy;
    ball.rotation += 0.15;

    spawnParticles();

    particles.forEach((p,index)=>{

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if(p.life<=0){
            particles.splice(index,1);
        }
    });

    if(
        ball.y < 0 ||
        ball.y > canvas.height
    ){
        lose();
    }

    obstacles.forEach((obs,index)=>{

        obs.x -= speed;

        if(
            ball.x + ball.size/2 > obs.x &&
            ball.x - ball.size/2 < obs.x + obs.width
        ){

            if(
                ball.y - ball.size/2 < obs.topHeight ||
                ball.y + ball.size/2 > obs.bottomY
            ){
                lose();
            }
        }

        if(
            !obs.passed &&
            obs.x + obs.width < ball.x
        ){

            obs.passed = true;

            score++;

            beep(800,70);

            document.getElementById("score")
            .textContent = score;

            if(score > bestScore){

                bestScore = score;

                localStorage.setItem(
                    "bestScore",
                    bestScore
                );

                document.getElementById("best")
                .textContent =
                "Best : " + bestScore;
            }
        }

        if(obs.x < -100){
            obstacles.splice(index,1);
        }

    });
}

function draw(){

    const gradient =
    ctx.createLinearGradient(
        0,
        0,
        0,
        canvas.height
    );

    gradient.addColorStop(0,"#0f172a");
    gradient.addColorStop(1,"#1e293b");

    ctx.fillStyle = gradient;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        ctx.globalAlpha = p.life/25;

        ctx.fillStyle="#00ffff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;

    obstacles.forEach(obs=>{

        ctx.shadowColor="#ff00ff";
        ctx.shadowBlur=20;

        ctx.fillStyle="#ff00ff";

        ctx.fillRect(
            obs.x,
            0,
            obs.width,
            obs.topHeight
        );

        ctx.fillRect(
            obs.x,
            obs.bottomY,
            obs.width,
            canvas.height
        );
    });

    ctx.save();

    ctx.translate(ball.x,ball.y);

    ctx.rotate(ball.rotation);

    ctx.shadowColor="#00ffff";
    ctx.shadowBlur=30;

    ctx.fillStyle="#00ffff";

    ctx.fillRect(
        -ball.size/2,
        -ball.size/2,
        ball.size,
        ball.size
    );

    ctx.restore();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

function restart(){

    score = 0;
    speed = 7;
    gravity = 0.55;

    ball.y = canvas.height/2;
    ball.vy = 0;

    obstacles.length = 0;
    particles.length = 0;

    document.getElementById(
        "score"
    ).textContent = "0";

    document.getElementById(
        "gameOver"
    ).style.display = "none";

    running = true;
}

window.addEventListener("click",()=>{

    if(!started){

        started = true;
        running = true;

        document.getElementById(
            "startScreen"
        ).style.display = "none";

        return;
    }

    if(running){

        gravity *= -1;

        beep(500,50);
    }
});

window.addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;

});

loop();
</script>

</body>
</html>
