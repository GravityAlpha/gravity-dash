<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Gravity Dash</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111827;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#score{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:40px;
    font-weight:bold;
}

#best{
    position:absolute;
    top:70px;
    left:20px;
    color:#d4af37;
    font-size:20px;
}

#gameover{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

button{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
}

#title{
    position:absolute;
    top:20px;
    right:20px;
    color:#d4af37;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="score">0</div>
<div id="best">Record : 0</div>
<div id="title">⚙️ STEAM GRAVITY ⚙️</div>

<div id="gameover">
    <h1>Game Over</h1>
    <button onclick="restart()">Rejouer</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

let running = true;
let score = 0;

let bestScore =
    Number(localStorage.getItem("bestScore")) || 0;

document.getElementById("best").textContent =
    "Record : " + bestScore;

const player = {
    x:150,
    y:canvas.height/2,
    size:30,
    vy:0
};

let gravity = 0.05;
let speed = 1.2;

const obstacles = [];
const trail = [];
const explosion = [];

function createObstacle(){

    const gap = 400;

    const topHeight =
        Math.random() *
        (canvas.height - gap - 150)
        + 75;

    obstacles.push({
        x:canvas.width,
        width:60,
        top:topHeight,
        bottom:topHeight+gap,
        passed:false
    });
}

setInterval(()=>{

    if(running){
        createObstacle();
    }

},3500);

function gameOver(){

    for(let i=0;i<60;i++){

        explosion.push({

            x:player.x,
            y:player.y,

            vx:Math.random()*8-4,
            vy:Math.random()*8-4,

            life:60,

            color:
            `hsl(${(score*25)%360},100%,50%)`

        });

    }

    running = false;

    document.getElementById("gameover")
        .style.display = "flex";
}

function restart(){

    running = true;

    score = 0;

    gravity = 0.05;
    speed = 1.2;

    player.y = canvas.height/2;
    player.vy = 0;

    obstacles.length = 0;
    trail.length = 0;
    explosion.length = 0;

    document.getElementById("score")
        .textContent = "0";

    document.getElementById("gameover")
        .style.display = "none";
}

window.addEventListener("click",()=>{

    if(!running) return;

    gravity *= -1;
    player.vy = 0;

});

window.addEventListener("touchstart",()=>{

    if(!running) return;

    gravity *= -1;
    player.vy = 0;

});

function update(){

    explosion.forEach((p,index)=>{

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if(p.life <= 0){
            explosion.splice(index,1);
        }
    });

    if(!running) return;

    player.vy += gravity;
    player.y += player.vy;

    trail.push({

        x:player.x,
        y:player.y,

        color:
        `hsl(${(score*25)%360},100%,50%)`

    });

    if(trail.length > 15){
        trail.shift();
    }

    if(
        player.y < 0 ||
        player.y > canvas.height
    ){
        gameOver();
    }

    for(let i=obstacles.length-1;i>=0;i--){

        const obs = obstacles[i];

        obs.x -= speed;

        if(
            player.x + player.size/2 > obs.x &&
            player.x - player.size/2 < obs.x + obs.width
        ){

            if(
                player.y - player.size/2 < obs.top ||
                player.y + player.size/2 > obs.bottom
            ){
                gameOver();
            }
        }

        if(
            !obs.passed &&
            obs.x + obs.width < player.x
        ){

            obs.passed = true;

            score++;

            if(score % 10 === 0){
                speed *= 1.1;
            }

            document.getElementById("score")
                .textContent = score;

            if(score > bestScore){

                bestScore = score;

                localStorage.setItem(
                    "bestScore",
                    bestScore
                );

                document.getElementById("best")
                    .textContent =
                    "Record : " + bestScore;
            }
        }

        if(obs.x < -100){
            obstacles.splice(i,1);
        }
    }
}

function draw(){

    const gradient =
    ctx.createLinearGradient(
        0,0,0,canvas.height
    );

    gradient.addColorStop(0,"#5a3a1a");
    gradient.addColorStop(1,"#1e1208");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    trail.forEach((t,index)=>{

        ctx.globalAlpha =
            (index / trail.length) * 0.6;

        ctx.fillStyle = t.color;

        ctx.fillRect(
            t.x - player.size/2,
            t.y - player.size/2,
            player.size,
            player.size
        );
    });

    ctx.globalAlpha = 1;

    obstacles.forEach(obs=>{

        ctx.fillStyle = "#8b5a2b";

        ctx.fillRect(
            obs.x,
            0,
            obs.width,
            obs.top
        );

        ctx.fillRect(
            obs.x,
            obs.bottom,
            obs.width,
            canvas.height
        );

    });

    explosion.forEach(p=>{

        ctx.globalAlpha =
            p.life / 60;

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            6,
            6
        );

    });

    ctx.globalAlpha = 1;

    const color =
        `hsl(${(score*25)%360},100%,50%)`;

    if(running){

        ctx.fillStyle = color;

        ctx.fillRect(
            player.x-player.size/2,
            player.y-player.size/2,
            player.size,
            player.size
        );
    }
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
